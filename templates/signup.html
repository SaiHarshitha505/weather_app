<!DOCTYPE html>
<html>
<head>
<title>Signup</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex justify-content-center align-items-center vh-100">
<div class="card p-4 shadow" style="width:350px;">
<h3 class="text-center">Signup</h3>
<form method="POST">
<input class="form-control mb-3" name="username" required placeholder="Username">
<input class="form-control mb-3" type="password" name="password" required placeholder="Password">
<button class="btn btn-success w-100">Signup</button>
</form>
<p class="mt-3 text-center">
<a href="/login">Login</a>
</p>
</div>
</body>
</html>
