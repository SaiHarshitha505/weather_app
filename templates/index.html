<!DOCTYPE html>
<html>
<head>
<title>Weather App</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-primary">
<div class="container-fluid">
<span class="navbar-brand">Weather Dashboard</span>
<div>
<span class="text-white me-3">Hi, {{ current_user.username }}</span>
<a href="/logout" class="btn btn-light btn-sm">Logout</a>
</div>
</div>
</nav>

<div class="container mt-5">
<div class="card p-4 shadow">
<form method="POST" class="d-flex gap-2">
<input class="form-control" name="city" placeholder="Enter city..." required>
<button class="btn btn-primary">Search</button>
</form>
</div>

{% if error %}
<div class="alert alert-danger mt-3">{{ error }}</div>
{% endif %}

{% if weather %}
<div class="card p-4 shadow mt-4 text-center">
<h2>{{ weather.city }}</h2>
<h3>{{ weather.temp }} °C</h3>
<p>Humidity: {{ weather.humidity }}%</p>
<p>{{ weather.condition }}</p>
</div>
{% endif %}

{% if graph %}
<div class="card p-4 shadow mt-4 text-center">
<h4>5-Day Forecast</h4>
<img src="{{ graph }}" class="img-fluid">
</div>
{% endif %}
</div>
</body>
</html>
